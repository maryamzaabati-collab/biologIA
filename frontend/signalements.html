<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signalements — TraceLab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span class="logo-mark"></span> TraceLab</div>
    <nav>
      <a href="accueil.html">Tableau de bord</a>
      <a href="index.html">Lots</a>
      <a href="machines.html">Machines</a>
      <a href="signalements.html" class="active">Signalements</a>
      <a href="controle.html">Cartes de contrôle</a>
      <a href="synthese.html">Synthèse</a>
      <a href="conformite.html">Conformité</a>
    </nav>
  </aside>
  <main>
    <h1>Signalements</h1>
    <p class="page-intro">Les anomalies repérées automatiquement. Un signalement ne se clôture que si le lot a été corrigé.</p>
    <p id="erreur-liste" class="message erreur" hidden></p>
    <div id="liste-signalements"></div>
  </main>
</div>
<script src="app.js"></script>
<script>
async function chargerSignalements() {
  const conteneur = document.getElementById('liste-signalements');
  afficherMessage('erreur-liste', '');
  try {
    const signalements = await api('/signalements');
    if (signalements.length === 0) {
      conteneur.innerHTML = '<p class="empty">Aucun signalement, bravo.</p>';
      return;
    }
    conteneur.innerHTML = signalements.map((s) => `
      <div class="signalement-row">
        <div>
          <a class="lien-lot" href="lot.html?id=${s.lot_id}&edit=1">${echap(s.lot_nom)}</a>
          <div class="raison">${echap(s.raison)}</div>
        </div>
        <div class="actions">
          <span class="badge douteux">Ouvert</span>
          <a class="btn-link" href="lot.html?id=${s.lot_id}&edit=1">Corriger</a>
          <button class="secondary" data-id="${s.id}">Marquer comme résolu</button>
        </div>
      </div>
    `).join('');
    conteneur.querySelectorAll('button[data-id]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        afficherMessage('erreur-liste', '');
        try {
          await api(`/signalements/${btn.dataset.id}/resoudre`, { method: 'PUT' });
          chargerSignalements();
        } catch (err) {
          afficherMessage('erreur-liste', err.message);
        }
      });
    });
  } catch (err) {
    conteneur.innerHTML = '';
    afficherMessage('erreur-liste', err.message);
  }
}
chargerSignalements();
</script>
</body>
</html>
