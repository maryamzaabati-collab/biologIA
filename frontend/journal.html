<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal — biologIA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span class="logo-mark"></span> biologIA</div>
    <nav></nav>
  </aside>
  <main>
    <h1>Journal d’audit</h1>
    <p class="page-intro">Qui a fait quoi, et quand. Visible des biologistes.</p>
    <p id="erreur-page" class="message erreur" hidden></p>
    <div id="liste"><p class="empty">Chargement…</p></div>
  </main>
</div>
<script src="app.js"></script>
<script>
(async () => {
  try {
    const lignes = await api('/journal');
    const box = document.getElementById('liste');
    if (!lignes.length) {
      box.innerHTML = '<p class="empty">Aucune action enregistrée pour l’instant.</p>';
      return;
    }
    box.innerHTML = `<table class="table-audit"><thead><tr><th>Date</th><th>Qui</th><th>Action</th><th>Cible</th></tr></thead><tbody>${
      lignes.map((l) => `<tr>
        <td>${echap(formatDateHeure(l.date))}</td>
        <td>${echap(l.nom_affiche)}</td>
        <td>${echap(l.action)}</td>
        <td>${echap(l.cible)} ${echap(l.details || '')}</td>
      </tr>`).join('')
    }</tbody></table>`;
  } catch (err) {
    afficherMessage('erreur-page', err.message);
  }
})();
</script>
</body>
</html>
