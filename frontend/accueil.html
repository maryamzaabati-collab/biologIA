<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Accueil — biologIA</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-accueil">
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span class="logo-mark" aria-hidden="true"></span> <span>biolog<b class="brand-ia">IA</b></span></div>
    <nav></nav>
  </aside>
  <main>
    <h1>Bienvenue dans biologIA</h1>
    <p class="page-intro" style="max-width:62ch">Le suivi des lots de données et des machines du laboratoire de Nice.</p>
    <p id="erreur-page" class="message erreur" hidden></p>
    <div class="accueil-reseau">
      <div class="card">
        <h2>À traiter</h2>
        <div id="a-traiter" class="a-traiter"><p class="empty">Chargement…</p></div>
      </div>
      <div class="card">
        <h2>Notre réseau en chiffres</h2>
        <div id="reseau-accueil" class="mini-stats" style="grid-template-columns:1fr 1fr"><p class="empty">Chargement…</p></div>
        <a class="btn-link primary" href="reseau.html">Voir les 20 laboratoires</a>
      </div>
    </div>
    <div class="card" style="margin:18px 0">
      <h2>Où en est le laboratoire ?</h2>
      <div id="anneaux" class="anneaux-ligne"><p class="empty">Chargement…</p></div>
    </div>
    <div class="actions">
      <a class="btn-link primary" href="demo.html">Visite guidée (5 min)</a>
      <a class="btn-link" href="tableau.html">Ouvrir le tableau de bord</a>
    </div>
  </main>
</div>
<script src="app.js"></script>
<script>
(async () => {
  try {
    const [s, machines] = await Promise.all([
      api('/synthese'),
      api('/machines').catch(() => [])
    ]);
    const calOk = (machines || []).filter((m) => !m.calibration_a_renouveler).length;
    const calKo = (machines || []).length - calOk;
    const ligne = (n, libelle, href, ton) => `<a class="a-traiter-ligne" href="${href}">
        <b class="${n ? ton : 'zero'}">${n}</b><span>${libelle}</span><span class="fleche" aria-hidden="true">›</span></a>`;
    document.getElementById('a-traiter').innerHTML =
      ligne(s.lotsAValider || 0, 'lots à valider', 'index.html?filtre=a_valider', 'attente')
      + ligne(s.lotsARevalider || 0, 'lots à revalider après une panne', 'index.html?filtre=a_revalider', 'alerte')
      + ligne(s.signalementsEnCours || 0, 'alertes ouvertes', 'signalements.html', 'alerte')
      + ligne(calKo, 'machines à recalibrer', 'machines.html', 'attente');
    document.getElementById('anneaux').innerHTML =
      htmlAnneau((s.pourcentageValides || 0) + ' %', 'lots validés', s.pourcentageValides)
      + htmlAnneau((s.pourcentageAnonymises || 0) + ' %', 'pseudonymisés', s.pourcentageAnonymises)
      + htmlAnneau(`${calOk} / ${(machines || []).length || 0}`, 'calibrations à jour', machines.length ? (100 * calOk / machines.length) : 0);
  } catch (err) {
    afficherMessage('erreur-page', err.message);
  }
  try {
    const r = await api('/reseau/resume');
    const fr = (n) => Number(n).toLocaleString('fr-FR');
    document.getElementById('reseau-accueil').innerHTML = `
      <div><b>${r.sites}</b><span>laboratoires en région Sud</span></div>
      <div><b>${(r.examens_total / 1e6).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} M</b><span>analyses (2025–2026)</span></div>
      <div><b>${fr(r.controles_qc)}</b><span>contrôles de machines</span></div>
      <div><b>${r.derives}</b><span>pannes repérées, en ${String(r.delai_moyen_detection).replace('.', ',')} jours en moyenne</span></div>`;
  } catch { /* observatoire indisponible */ }
})();
</script>
</body>
</html>
