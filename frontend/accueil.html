<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord — biologIA</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-accueil">
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span class="logo-mark"></span> biologIA</div>
    <nav>
      <a href="accueil.html" class="active">Tableau de bord</a>
      <a href="index.html">Lots</a>
      <a href="machines.html">Machines</a>
      <a href="signalements.html">Signalements</a>
      <a href="controle.html">Cartes de contrôle</a>
      <a href="synthese.html">Synthèse</a>
      <a href="conformite.html">Conformité</a>
    </nav>
  </aside>
  <main>
    <div class="page-head">
      <div>
        <h1 id="bonjour">Tableau de bord</h1>
      </div>
      <a class="btn-link primary only-technicien" href="nouveau-lot.html">+ Nouveau lot</a>
    </div>
    <p id="erreur-page" class="message erreur" hidden></p>
    <div id="stats" class="stats-row"></div>
    <div class="card" style="margin-bottom:18px">
      <div class="page-head" style="margin:0 0 8px">
        <h2>À faire aujourd’hui</h2>
        <a class="btn-link" href="index.html">Tout voir</a>
      </div>
      <div id="urgence" class="urgence"><p class="empty">Chargement…</p></div>
    </div>
    <div class="card" id="qualite"></div>
    <div class="card card-code">
      <form id="form-code">
        <label for="code-verif">Ouvrir un lot par code de vérification</label>
        <div class="actions">
          <input type="text" id="code-verif" placeholder="Ex : LT-AB12CD34" autocomplete="off">
          <button type="submit" style="margin-top:0">Ouvrir</button>
        </div>
      </form>
    </div>
    <p id="erreur-code" class="message erreur" hidden></p>
  </main>
</div>
<script src="app.js"></script>
<script>
document.querySelector('label[for="code-verif"]').innerHTML =
  'Ouvrir un lot par code de vérification ' + aide('Identifiant unique du lot, aussi imprimé en code-barres sur le certificat.');

document.getElementById('form-code').addEventListener('submit', async (e) => {
  e.preventDefault();
  afficherMessage('erreur-code', '');
  const code = document.getElementById('code-verif').value.trim();
  if (!code) return afficherMessage('erreur-code', 'Saisissez un code de vérification.');
  try {
    const r = await api('/lots/par-code/' + encodeURIComponent(code));
    window.location.href = 'lot.html?id=' + r.id;
  } catch (err) {
    afficherMessage('erreur-code', err.message);
  }
});

(async () => {
  try {
    const [s, lots, moi, machines] = await Promise.all([
      api('/synthese'),
      api('/lots'),
      api('/auth/moi').catch(() => null),
      api('/machines').catch(() => [])
    ]);
    const prenom = moi?.nom || 'là';
    document.getElementById('bonjour').textContent = 'Bonjour ' + prenom;
    const nMachines = Array.isArray(machines) ? machines.length : 0;
    document.getElementById('stats').innerHTML = `
      <a class="stat stat-wait" href="index.html?filtre=a_valider"><div class="valeur">${s.lotsAValider ?? 0}</div><div class="label">À valider</div></a>
      <a class="stat stat-reval" href="index.html?filtre=a_revalider"><div class="valeur">${s.lotsARevalider || 0}</div><div class="label">À revalider</div></a>
      <a class="stat stat-alert" href="index.html?filtre=signale"><div class="valeur">${s.lotsDouteux || 0}</div><div class="label">Signalé</div></a>
      <a class="stat stat-teal" href="machines.html"><div class="valeur">${nMachines}</div><div class="label">Machines</div></a>
      <a class="stat stat-alert" href="signalements.html"><div class="valeur">${s.signalementsEnCours}</div><div class="label">Signalements</div></a>
    `;
    const recents = [...lots]
      .filter((l) => !Number(l.est_test))
      .sort((a, b) => String(b.date || b.date_creation || '').localeCompare(String(a.date || a.date_creation || '')))
      .slice(0, 6);
    const box = document.getElementById('urgence');
    if (!recents.length) {
      box.innerHTML = '<p class="empty">Aucun lot pour le moment.</p>';
    } else {
      box.innerHTML = recents.map((l) => `
        <a href="lot.html?id=${l.id}${l.statut_affiche === 'signale' || l.statut_affiche === 'brouillon' ? '&edit=1' : ''}">
          <span><strong>${echap(l.nom)}</strong><br><span class="meta">${echap(l.machine_nom || 'machine n/r')}</span></span>
          <span class="badge ${classeBadge(l.statut_affiche)}">${echap(l.statut_libelle)}</span>
        </a>
      `).join('');
    }
    const pct = s.totalLots ? Math.round(100 * (s.lotsValides || 0) / s.totalLots) : 0;
    document.getElementById('qualite').innerHTML = `
      <div class="page-head" style="margin:0">
        <div>
          <h2>Lots validés</h2>
          <p class="hint" style="margin:0">${s.lotsValides || 0} sur ${s.totalLots} · hors lot TEST</p>
        </div>
        <strong>${pct} %</strong>
      </div>
      <div class="score-ligne" style="margin-top:12px"><span class="piste"><i style="width:${pct}%"></i></span></div>
      <p class="hint">${pluriel(s.signalementsEnCours, 'signalement')} ${Number(s.signalementsEnCours) > 1 ? 'ouverts' : 'ouvert'}.</p>`;
  } catch (err) {
    afficherMessage('erreur-page', err.message);
    document.getElementById('urgence').innerHTML = '';
  }
})();
</script>
</body>
</html>
