<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Lignée — biologIA</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-lignee">
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span class="logo-mark" aria-hidden="true"></span> <span>biolog<b class="brand-ia">IA</b></span></div>
    <nav></nav>
  </aside>
  <main>
    <div class="page-head">
      <div>
        <h1>Lignée</h1>
        <p class="page-intro">Du patient à la validation, étape par étape. Chaque étape garde sa date et son auteur.</p>
      </div>
    </div>
    <div class="filtres">
      <input type="search" id="filtre-lot" placeholder="LOT-2026-013" autocomplete="off">
    </div>
    <p id="erreur-page" class="message erreur" hidden></p>
    <div id="liste"><p class="empty">Chargement…</p></div>
  </main>
</div>
<script src="app.js"></script>
<script>
let cacheLots = [];
function htmlParcours(etapes) {
  const client = roleActuel() === 'client';
  return `<div class="parcours">${(etapes || []).map((e) => {
    const lien = e.href && !(client && e.reserve === 'patients');
    return `
    <div class="parcours-etape">
      <span class="hint">${echap(e.libelle)}</span>
      <strong>${lien ? `<a href="${e.href}">${echap(e.valeur)}</a>` : echap(e.valeur)}</strong>
      <span class="hint">${[e.date ? formatDate(e.date) : '', e.auteur || ''].filter(Boolean).map(echap).join(' · ')}</span>
    </div>`;
  }).join('<span class="parcours-fleche">→</span>')}</div>`;
}
function dessiner(filtre) {
  const box = document.getElementById('liste');
  const q = String(filtre || '').toLowerCase();
  const lots = cacheLots.filter((l) => !Number(l.est_test) && (!q || String(l.nom).toLowerCase().includes(q) || String(l.code_verification || '').toLowerCase().includes(q)));
  if (!lots.length) {
    box.innerHTML = '<p class="empty">Aucun lot à tracer.</p>';
    return;
  }
  box.innerHTML = lots.map((l) => `
    <article class="card" style="margin-bottom:12px">
      <div class="page-head" style="margin:0">
        <h3><a href="lot.html?id=${l.id}">${echap(l.nom)}</a>
          <span class="badge ${classeBadge(l.statut_affiche)}">${echap(l.statut_libelle)}</span></h3>
        <button type="button" class="secondary" data-ouvrir="${l.id}">Afficher le parcours</button>
      </div>
      <div id="parcours-${l.id}" hidden>${htmlParcours(l.etapes)}</div>
    </article>`).join('');
  box.querySelectorAll('[data-ouvrir]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const el = document.getElementById('parcours-' + btn.dataset.ouvrir);
      el.hidden = !el.hidden;
      btn.textContent = el.hidden ? 'Afficher le parcours' : 'Masquer';
    });
  });
}
(async () => {
  try {
    cacheLots = await api('/lignee');
    dessiner('');
    document.getElementById('filtre-lot').addEventListener('input', (e) => dessiner(e.target.value));
  } catch (err) {
    afficherMessage('erreur-page', err.message);
  }
})();
</script>
</body>
</html>
