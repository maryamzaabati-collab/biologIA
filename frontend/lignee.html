<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lignée — biologIA</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-lignee">
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span class="logo-mark"></span> biologIA</div>
    <nav></nav>
  </aside>
  <main>
    <h1>Lignée des données</h1>
    <p class="page-intro">Patient pseudonymisé → mesures → lot → machine → règle → alerte → validation. Dates et auteurs à chaque étape.</p>
    <p id="erreur-page" class="message erreur" hidden></p>
    <div id="liste"><p class="empty">Chargement…</p></div>
  </main>
</div>
<script src="app.js"></script>
<script>
(async () => {
  try {
    const lots = await api('/lignee');
    const box = document.getElementById('liste');
    if (!lots.length) {
      box.innerHTML = '<p class="empty">Aucun lot à tracer.</p>';
      return;
    }
    box.innerHTML = lots.map((l) => `
      <article class="card" style="margin-bottom:14px">
        <h3><a href="lot.html?id=${l.id}">${echap(l.nom)}</a>
          <span class="badge ${classeBadge(l.statut_affiche)}">${echap(l.statut_libelle)}</span></h3>
        <div class="schema-lignee">
          ${(l.etapes || []).map((e) => `
            <span>
              ${echap(e.libelle)}<br>
              <strong>${e.href ? `<a href="${e.href}">${echap(e.valeur)}</a>` : echap(e.valeur)}</strong>
              ${e.date ? `<small>${formatDateHeure(e.date)}</small>` : ''}
              ${e.auteur ? `<small>${echap(e.auteur)}</small>` : ''}
            </span>`).join('<span>→</span>')}
        </div>
      </article>
    `).join('');
  } catch (err) {
    afficherMessage('erreur-page', err.message);
  }
})();
</script>
</body>
</html>
