<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Machine — biologIA</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-machine">
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span class="logo-mark" aria-hidden="true"></span> <span>biolog<b class="brand-ia">IA</b></span></div>
    <nav></nav>
  </aside>
  <main>
    <p style="margin:0 0 8px"><a href="machines.html" style="color:var(--ink-soft);text-decoration:none;font-size:0.88rem">← Machines</a></p>
    <p id="erreur-page" class="message erreur" hidden></p>
    <div id="fiche"><p class="empty">Chargement…</p></div>
  </main>
</div>
<script src="app.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
(async () => {
  if (!id) {
    document.getElementById('fiche').innerHTML = '';
    return afficherMessage('erreur-page', 'Aucune machine indiquée.');
  }
  try {
    const [m, serie] = await Promise.all([
      api('/machines/' + id),
      api('/controle?machine_id=' + encodeURIComponent(id)).then((c) => {
        if (c && Array.isArray(c.series) && c.series.length) return c.series[0];
        return c;
      }).catch(() => null)
    ]);
    document.title = `${m.nom} — biologIA`;
    const horsTest = (m.lots || []).filter((l) => !Number(l.est_test));
    const st = m.stats || {};
    const maint = m.statut_service === 'maintenance' || m.statut_service === 'hors_service';
    const libEtat = m.statut_service === 'hors_service' ? 'Hors service' : (m.statut_service === 'maintenance' ? 'Maintenance' : 'En service');
    const calOk = !m.calibration_a_renouveler && !maint;
    document.getElementById('fiche').innerHTML = `
      <div class="page-head">
        <div>
          <h1>${echap(m.nom)} <span class="badge ${maint ? 'douteux' : 'ok'}">${libEtat}</span></h1>
          <p class="page-intro">${echap(m.fabricant || 'fabricant n/r')} · ${echap(m.type || 'type n/r')}${m.secteur ? ` · ${echap(m.secteur)}` : ''}</p>
          <p class="hint" style="margin:0">${m.numero_serie ? `N° de série ${echap(m.numero_serie)} · ` : ''}${m.mise_en_service ? `en service depuis le ${formatDate(m.mise_en_service)} · ` : ''}dernière calibration ${m.date_calibration ? formatDate(m.date_calibration) : '—'}</p>
        </div>
        <a class="btn-link" href="controle.html?machine_id=${m.id}">Ouvrir la carte de contrôle</a>
      </div>
      <div class="card anneaux-ligne" style="margin-bottom:14px">
        ${htmlAnneau(`${st.valides || 0} / ${st.lots || 0}`, 'lots validés', st.lots ? 100 * st.valides / st.lots : 0)}
        ${htmlAnneau(String(st.score_moyen || 0), 'note de confiance moyenne', st.score_moyen)}
        ${htmlAnneau(String(st.signalements || 0), 'signalements ouverts', st.signalements ? 80 : 8, st.signalements ? 'faible' : 'ok')}
        ${htmlAnneau(calOk ? 'OK' : 'KO', 'calibration', calOk ? 100 : 20, calOk ? 'ok' : 'faible')}
      </div>
      <div class="dash-2">
        <div class="card">
          <h2>${echap((serie && serie.parametre) || (serie && serie.series && serie.series[0] && serie.series[0].parametre) || 'Carte de contrôle')}</h2>
          ${serie ? htmlCarteControle(serie) : '<p class="empty">Pas assez de points pour tracer la carte.</p>'}
        </div>
        <div class="card">
          <h2>Erreurs et alertes</h2>
          ${(m.signalements || []).length
            ? `<ul>${m.signalements.map((s) => `<li><a href="lot.html?id=${s.lot_id}"><strong>${echap(s.lot_nom)}</strong></a><br><span class="hint">${echap(s.raison)}</span></li>`).join('')}</ul>`
            : '<p class="empty">Aucune alerte ouverte.</p>'}
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <h2>Lots de cette machine</h2>
        <div class="chips-lots">
          ${horsTest.map((l) => {
            const n = String(l.nom).replace(/^LOT-\d{4}-/, '');
            return `<a href="lot.html?id=${l.id}"><strong>${echap(n)}</strong> <span class="badge ${classeBadge(l.statut_affiche)}">${echap(l.statut_libelle)}</span></a>`;
          }).join('') || '<p class="empty">Aucun lot.</p>'}
        </div>
      </div>
    `;
  } catch (err) {
    document.getElementById('fiche').innerHTML = '';
    afficherMessage('erreur-page', err.message);
  }
})();
</script>
</body>
</html>
