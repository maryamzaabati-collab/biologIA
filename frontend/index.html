<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lots — biologIA</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-lots">
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span class="logo-mark"></span> biologIA</div>
    <nav>
      <a href="accueil.html">Tableau de bord</a>
      <a href="index.html" class="active">Lots</a>
      <a href="machines.html">Machines</a>
      <a href="signalements.html">Signalements</a>
      <a href="controle.html">Cartes de contrôle</a>
      <a href="synthese.html">Synthèse</a>
      <a href="conformite.html">Conformité</a>
    </nav>
  </aside>
  <main>
    <div class="page-head">
      <div>
        <h1>Lots</h1>
        <p class="page-intro">Tous les jeux de données de référence.</p>
      </div>
      <a class="btn-link primary only-technicien" href="nouveau-lot.html">+ Nouveau lot</a>
    </div>
    <div class="lots-toolbar">
    <div class="pills" id="pills">
      <button type="button" class="secondary active" data-filtre="">Tous</button>
      <button type="button" class="secondary" data-filtre="brouillon">Brouillons</button>
      <button type="button" class="secondary" data-filtre="a_valider">À valider</button>
      <button type="button" class="secondary" data-filtre="valide">Validés</button>
      <button type="button" class="secondary" data-filtre="a_revalider">À revalider</button>
      <button type="button" class="secondary" data-filtre="signale">Signalés</button>
    </div>
    <div class="filtres">
      <input type="search" id="filtre-q" placeholder="Rechercher un lot">
      <select id="filtre-machine"><option value="">Toutes les machines</option></select>
      <input type="date" id="filtre-date">
    </div>
    <p id="erreur-liste" class="message erreur" hidden></p>
    </div>
    <div id="liste-lots" class="lots-grille"><p class="empty">Chargement…</p></div>
    <div id="pagination-lots" class="pagination"></div>
    <p class="only-biologiste hint" style="margin-top:24px;">Ouvrez un lot pour le valider.</p>
  </main>
</div>
<script src="app.js"></script>
<script>
let filtreStatutAffiche = new URLSearchParams(location.search).get('filtre') || '';
let pageLots = 1;
const PAGE_LOTS = 9;

async function remplirMachines() {
  const machines = await api('/machines');
  const select = document.getElementById('filtre-machine');
  machines.forEach((m) => {
    const option = document.createElement('option');
    option.value = m.id;
    option.textContent = m.nom;
    select.appendChild(option);
  });
}

function queryLots() {
  const params = new URLSearchParams();
  const q = document.getElementById('filtre-q').value.trim();
  const machine = document.getElementById('filtre-machine').value;
  const date = document.getElementById('filtre-date').value;
  if (q) params.set('q', q);
  if (machine) params.set('machine_id', machine);
  if (filtreStatutAffiche === 'signale') params.set('statut_affiche', 'signale');
  if (date) params.set('date', date);
  const s = params.toString();
  return s ? `/lots?${s}` : '/lots';
}

async function chargerLots() {
  const conteneur = document.getElementById('liste-lots');
  afficherMessage('erreur-liste', '');
  try {
    let lots = await api(queryLots());
    if (filtreStatutAffiche) lots = lots.filter((l) => l.statut_affiche === filtreStatutAffiche);
    if (lots.length === 0) {
      conteneur.innerHTML = '<p class="empty">Aucun lot ne correspond à ces critères.</p>';
      document.getElementById('pagination-lots').innerHTML = '';
      return;
    }
    const pages = Math.max(1, Math.ceil(lots.length / PAGE_LOTS));
    if (pageLots > pages) pageLots = pages;
    const slice = lots.slice((pageLots - 1) * PAGE_LOTS, pageLots * PAGE_LOTS);
    conteneur.innerHTML = slice.map((lot) => `
      <a class="lot-carte" href="lot.html?id=${lot.id}">
        <span class="badge ${classeBadge(lot.statut_affiche)}">${echap(lot.statut_libelle)}</span>
        <strong class="lot-carte-nom">${echap(lot.nom)}${Number(lot.est_test) ? ' · TEST' : ''}</strong>
        <span class="lot-carte-machine">${echap(lot.machine_nom || 'machine non renseignée')}</span>
        <span class="lot-carte-date">${formatDate(lot.date)}</span>
        <span class="lot-carte-pied">
          ${htmlJauge(lot.score_confiance, 'Score de confiance', null, { mini: true })}
          <span class="lot-carte-ref">${refLot(lot.id)}</span>
        </span>
      </a>
    `).join('');
    const pag = document.getElementById('pagination-lots');
    pag.innerHTML = pages > 1
      ? `<button type="button" class="secondary" data-p="${pageLots - 1}" ${pageLots <= 1 ? 'disabled' : ''}>Précédent</button>
         <span>Page ${pageLots} / ${pages}</span>
         <button type="button" class="secondary" data-p="${pageLots + 1}" ${pageLots >= pages ? 'disabled' : ''}>Suivant</button>`
      : '';
  } catch (err) {
    conteneur.innerHTML = '';
    afficherMessage('erreur-liste', err.message);
  }
}

document.getElementById('pills').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-filtre]');
  if (!btn) return;
  filtreStatutAffiche = btn.dataset.filtre;
  pageLots = 1;
  document.querySelectorAll('#pills [data-filtre]').forEach((b) => b.classList.toggle('active', b === btn));
  chargerLots();
});

document.getElementById('pagination-lots').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-p]');
  if (!btn || btn.disabled) return;
  pageLots = Number(btn.dataset.p);
  chargerLots();
});

['filtre-q', 'filtre-machine', 'filtre-date'].forEach((id) => {
  document.getElementById(id).addEventListener('input', () => { pageLots = 1; chargerLots(); });
  document.getElementById(id).addEventListener('change', () => { pageLots = 1; chargerLots(); });
});

(async () => {
  try { await remplirMachines(); } catch (err) { afficherMessage('erreur-liste', err.message); }
  document.querySelectorAll('#pills [data-filtre]').forEach((b) => {
    b.classList.toggle('active', b.dataset.filtre === filtreStatutAffiche);
  });
  chargerLots();
})();
</script>
</body>
</html>
