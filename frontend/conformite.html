<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Conformité — biologIA</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-conformite">
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span class="logo-mark" aria-hidden="true"></span> <span>biolog<b class="brand-ia">IA</b></span></div>
    <nav></nav>
  </aside>
  <main>
    <div class="page-head">
      <div>
        <h1>Conformité</h1>
        <p class="page-intro">Ce que le site protège, et ce qu’il ne garantit pas encore. Chaque état est calculé à partir d’un vrai contrôle, pas écrit à la main.</p>
      </div>
    </div>
    <p id="erreur-page" class="message erreur" hidden></p>
    <div id="liste"><p class="empty">Chargement…</p></div>
  </main>
</div>
<script src="app.js"></script>
<script>
(async () => {
  try {
    const c = await api('/conformite');
    const badge = (s) => s === 'mis_en_place' ? 'ok' : (s === 'partiel' ? 'attente' : 'douteux');
    const lib = (s) => s === 'mis_en_place' ? 'Mis en place' : (s === 'partiel' ? 'Partiel' : 'À faire');
    document.getElementById('liste').innerHTML = `
      <div class="card">${c.items.map((it) => `
        <div class="conformite-ligne">
          <div>
            <strong>${echap(it.titre)}</strong>
            <p>${echap(it.resume || it.detail)}</p>
            ${it.resume && it.detail ? `<details class="detail-technique"><summary>Détail technique</summary><p>${echap(it.detail)}</p></details>` : ''}
          </div>
          <span class="badge ${badge(it.statut)}">${lib(it.statut)}</span>
        </div>`).join('')}
      </div>
      <div class="card" style="margin-top:20px">
        <strong>Note de transparence (AI Act)</strong>
        <p class="hint">${echap(c.note_ai)}</p>
      </div>`;
  } catch (err) {
    afficherMessage('erreur-page', err.message);
  }
})();
</script>
</body>
</html>
